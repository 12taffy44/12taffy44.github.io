# ==============================================
# Butterfly 主题配置
# 这里只列出需要覆盖的配置项，未列出的会自动使用主题默认值
# 主题完整默认配置：node_modules/hexo-theme-butterfly/_config.yml
# 官方文档：https://butterfly.js.org/
# ==============================================

# 菜单（主题默认没有菜单项，需要自己配置；不需要的项设为 false）
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  推荐: /recommend/ || fas fa-star
  关于: /about/ || fas fa-heart

# 社交图标（去掉注释即可显示）
social:
  # fab fa-github: https://github.com/12taffy44 || Github || '#24292e'
  # fas fa-envelope: mailto:you@example.com || Email || '#4a7dbe'

# 站点图标（替换成自己的图片时，把图片放到 source/img/ 下并修改路径）
favicon: /img/miku.jpg

index_img: /img/miku.jpg

# 头像
avatar:
  img: /img/chuhua.jpg
  effect: false

# 404 页面
error_404:
  enable: true
  subtitle: 找不到了喵ww

# 首页打字机副标题（想要就取消注释并填入文字）
subtitle:
  enable: true
  effect: true
  sub:
    - 没有太晚的开始,只有太早的放弃

# 本地搜索（依赖 hexo-generator-searchdb）
search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: true

# 文章字数统计与阅读时长（依赖 hexo-wordcount）
wordcount:
  enable: true

# 页脚
footer:
  owner:
    enable: true
    since: 2026

aside:
  card_author:
    enable: true
    description: 誓死效忠丰川祥子
    button:
      enable: true
      icon: fas fa-user
      text: 了解我喵
      link: /about/     # 默认是 https://github.com/xxxxxx ，改成关于页更合适
  card_announcement: # 新增，与 card_author 同级 
    enable: true # 默认就是 true；设 false 可整块关掉 
    content: 关注塔菲喵,关注塔菲谢谢喵

# _config.butterfly.yml
archive_img: /img/gbc.webp

# 顶部图高度
index_top_img_height: 100vh # 首页大图铺满首屏；想让它矮一点就改成 60vh / 500px

# 目录（正文右侧的悬浮目录）
toc:
  page: true # 让页面（/recommend/、/about/ 等）也显示目录；文章默认就有

# 注入自定义样式：内页顶部图铺满首屏（主题默认 400px，手机 280px）
inject:
  head:
    - '<style>body #page-header.not-home-page{height:100vh}</style>'
category_img: /img/muzimi.jpg

